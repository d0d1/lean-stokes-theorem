name = "LeanStokes"
version = "0.1.0"
keywords = ["math", "stokes-theorem", "differential-forms", "formalization"]
defaultTargets = ["LeanStokes"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.1"

[[lean_lib]]
name = "LeanStokes"

[[lean_exe]]
name = "diagnostics"
root = "LeanStokes.Diagnostics.Main"
